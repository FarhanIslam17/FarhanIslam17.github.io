/* ../../opt/files/kit/library.css */
:root {
  --file-shadow: 0 1px 2px rgb(37 31 33 / 6%), 0 6px 18px rgb(37 31 33 / 5%);
  --file-pad-x: 24px;
  --file-col: 200px;
  --file-product-col: 300px;
  --file-text: 14px;
  --file-small: 12px;
  --file-button-roll: 320ms;
  --file-low-stock: #d59b53;
}
.file-ground {
  box-sizing: border-box;
  min-height: 100%;
  padding: 24px 16px;
  background: var(--ds-raised);
  color: var(--ds-ink);
  font-family: var(--ds-font-text);
  font-size: var(--file-text);
  font-weight: 350;
  line-height: 24px;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
.file-card {
  box-sizing: border-box;
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding: 24px var(--file-pad-x);
  background: var(--ds-page);
  color: var(--ds-ink);
  display: flex;
  flex-direction: column;
  gap: 48px;
  font-family: var(--ds-font-text);
  font-size: var(--file-text);
  font-weight: 350;
  line-height: 24px;
  letter-spacing: -0.01em;
}
.file-card[data-width=phone] {
  max-width: 390px;
}
.file-ground .file-card {
  border-radius: 24px;
  box-shadow: var(--file-shadow);
}
.file-card > * {
  min-width: 0;
}
.file-card a {
  color: var(--ds-ink);
}
.file-card :focus-visible {
  outline: 2px solid var(--ds-ink);
  outline-offset: 2px;
}
.file-strong {
  font-weight: 600;
}
.file-secondary {
  color: var(--ds-ink-2);
}
.file-known {
  color: var(--ds-teal);
  font-weight: 600;
}
.file-unavailable {
  color: var(--ds-ink-4);
  text-decoration: line-through;
}
.file-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.file-header {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.file-title {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: 400;
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.file-fact {
  margin: 0;
  color: var(--ds-ink-2);
  font-weight: 400;
}
.file-fact.is-known {
  color: var(--ds-teal);
  font-weight: 600;
}
.file-intro {
  margin: 12px 0 0;
  line-height: 24px;
  text-wrap: pretty;
}
.file-group {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.file-group-label {
  margin: 0;
  font: inherit;
  color: var(--ds-ink-2);
}
.file-group-heading {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: 400;
  font-size: 21px;
  line-height: 1.1;
  letter-spacing: -0.025em;
}
.file-rows {
  display: flex;
  flex-direction: column;
}
.file-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--ds-hairline);
}
.file-row:last-child {
  border-bottom: 0;
}
.file-row-slot {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 3px;
  background: var(--ds-raised);
  overflow: hidden;
}
.file-row-slot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.file-row-slot.is-number {
  width: 24px;
  height: auto;
  background: none;
  color: var(--ds-ink-2);
}
.file-row-slot.is-number::after,
.file-step-n::after {
  content: ".";
}
.file-row-main {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
.file-row-detail {
  color: var(--ds-ink-2);
}
.file-row-value {
  flex: none;
  font-weight: 600;
  text-align: right;
}
.file-facts {
  display: flex;
  flex-direction: column;
  margin: 0;
}
.file-facts > div {
  display: grid;
  grid-template-columns: min(var(--file-col), 38%) minmax(0, 1fr);
  padding: 12px 0;
  border-bottom: 1px solid var(--ds-hairline);
}
.file-facts > div:last-child {
  border-bottom: 0;
}
.file-facts dt {
  color: var(--ds-ink-2);
  padding-right: 16px;
}
.file-facts dd {
  margin: 0;
}
.file-text {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.file-heading {
  display: flex;
  flex-direction: column;
}
.file-p {
  margin: 0;
  line-height: 24px;
  text-wrap: pretty;
}
.file-bullets {
  margin: 0;
  padding: 0 0 0 20px;
  list-style: disc;
  display: flex;
  flex-direction: column;
  gap: 8px;
  line-height: 24px;
}
.file-bullets li {
  display: list-item;
  padding-left: 2px;
}
.file-bar {
  position: relative;
  padding-left: 16px;
}
.file-bar::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  border-radius: 1px;
  background: var(--ds-hairline);
}
.file-key {
  margin: 0;
  font-weight: 600;
  line-height: 24px;
}
.file-figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.file-figure img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: 4px;
  background: var(--ds-raised);
}
.file-caption,
.file-figure figcaption {
  margin: 0;
  color: var(--ds-ink-2);
  font-size: var(--file-small);
  line-height: 20px;
  text-wrap: pretty;
}
.file-photos + .file-caption,
.file-strip + .file-caption {
  margin-top: 12px;
}
.file-card > :is(.file-photos, .file-strip) + .file-caption {
  margin-top: -36px;
}
.file-text > :is(.file-photos, .file-strip) + .file-caption {
  margin-top: -20px;
}
.file-group > :is(.file-photos, .file-strip) + .file-caption,
.file-chart + .file-caption,
.file-table-scroll + .file-caption {
  margin-top: -12px;
}
.file-rule {
  margin: 8px 0;
  border: 0;
  height: 1px;
  background: var(--ds-hairline);
}
.file-link {
  color: var(--ds-ink);
  overflow-wrap: anywhere;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--ds-ink-4);
}
.file-link:hover {
  text-decoration-color: currentColor;
}
.file-callout {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-wrap: pretty;
}
.file-callout[data-tone=warning] {
  padding: 16px;
  border-radius: 8px;
  background: var(--ds-raised);
  color: var(--ds-ink);
}
.file-callout[data-tone=warning]::before {
  display: none;
}
.file-callout[data-tone=danger] {
  color: var(--ds-red);
}
.file-callout[data-tone=danger]::before {
  background: var(--ds-red);
}
.file-steps {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
}
.file-steps li {
  display: flex;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid var(--ds-hairline);
  text-wrap: pretty;
}
.file-steps li:last-child {
  border-bottom: 0;
}
.file-steps li > span:last-child {
  min-width: 0;
  flex: 1;
  overflow-wrap: anywhere;
}
.file-step-n {
  flex: none;
  width: 24px;
  color: var(--ds-ink-2);
}
.file-table-scroll {
  position: relative;
  overflow-x: auto;
  margin-inline: calc(-1 * var(--file-pad-x));
  padding-inline: var(--file-pad-x) 0;
  scroll-padding-inline: var(--file-pad-x) 0;
}
.file-table {
  table-layout: fixed;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.file-table th,
.file-table td {
  padding: 12px 16px 12px 0;
  border-bottom: 1px solid var(--ds-hairline);
  text-align: left;
  vertical-align: top;
  font-weight: 350;
  overflow-wrap: anywhere;
}
.file-table tbody tr:last-child th,
.file-table tbody tr:last-child td {
  border-bottom: 0;
}
.file-table thead th {
  padding-top: 0;
}
.file-table thead th .file-secondary {
  margin-left: 8px;
}
.file-table tbody th {
  color: var(--ds-ink-2);
}
.file-table td.is-best,
.file-table td.file-product-price {
  font-weight: 600;
}
.file-table.is-products {
  font-variant-numeric: normal;
}
.file-table.is-products thead th {
  padding-bottom: 20px;
  vertical-align: top;
}
.file-cell-label {
  display: block;
  color: var(--ds-ink-2);
  font-size: var(--file-small);
  line-height: 20px;
  font-weight: 350;
}
.file-product-head {
  display: flex;
  flex-direction: column;
}
.file-product-head-photo {
  position: relative;
  display: block;
  margin-bottom: 12px;
}
.file-product-head-photo img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 12px;
  background: var(--ds-raised);
}
.file-product-head-photo > .file-product-empty {
  display: grid;
  aspect-ratio: 1;
  border-radius: 12px;
  background: var(--ds-raised);
  padding: 16px;
}
.file-photos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
  gap: 8px;
  min-width: 0;
}
.file-photos img {
  display: block;
  width: 100%;
  min-width: 0;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 8px;
  background: var(--ds-raised);
}
.file-photos[data-layout=strip] {
  display: flex;
  align-items: flex-start;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.file-photos[data-layout=strip]::-webkit-scrollbar {
  display: none;
}
.file-photos[data-layout=strip] img {
  flex: 0 0 auto;
  width: 85%;
  max-width: 480px;
  aspect-ratio: auto;
  scroll-snap-align: start;
}
.file-photo-zoom {
  all: unset;
  box-sizing: border-box;
  display: block;
  min-width: 0;
  border-radius: 8px;
  cursor: zoom-in;
}
.file-photos[data-layout=strip] > .file-photo-zoom {
  flex: 0 0 auto;
  width: 85%;
  max-width: 480px;
  scroll-snap-align: start;
}
.file-photos[data-layout=strip] > .file-photo-zoom img {
  width: 100%;
  max-width: none;
}
.file-photos.is-single > .file-photo-zoom {
  width: 100%;
  max-width: none;
}
.file-photo-zoom:focus-visible {
  outline: 2px solid var(--ds-ink);
  outline-offset: -2px;
}
[data-can-drag],
[data-can-drag] .file-product-toggle,
[data-can-drag] .file-product-zoom,
[data-can-drag] .file-photo-zoom {
  cursor: grab;
}
[data-drag-scroll] {
  position: relative;
}
[data-drag-scroll][data-dragging] {
  scroll-snap-type: none;
  user-select: none;
}
[data-dragging],
[data-dragging] .file-product-toggle,
[data-dragging] .file-product-zoom,
[data-dragging] .file-photo-zoom {
  cursor: grabbing;
}
.file-photos.is-single img {
  width: 100%;
  max-width: none;
  aspect-ratio: auto;
}
.file-bleed {
  margin-inline: calc(-1 * var(--file-pad-x));
  padding-inline: var(--file-pad-x);
  scroll-padding-inline: var(--file-pad-x);
}
.file-strip {
  position: relative;
  min-width: 0;
}
.file-strip[data-bleed] {
  margin-inline: calc(-1 * var(--file-pad-x));
}
.file-strip > .file-bleed {
  margin-inline: 0;
}
.file-strip-arrows {
  position: absolute;
  inset: 50% var(--file-strip-arrows-inset, 12px) auto;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  transform: translateY(-50%);
  pointer-events: none;
}
.file-strip-arrow {
  all: unset;
  box-sizing: border-box;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--ds-page);
  color: var(--ds-ink);
  box-shadow: var(--ds-elevation-0);
  cursor: pointer;
  pointer-events: auto;
  transition:
    opacity 160ms ease-out,
    transform 160ms ease-out,
    visibility 0s;
  animation: file-strip-arrow-in 160ms ease-out;
}
.file-strip-arrow:disabled {
  opacity: 0;
  transform: scale(0.95);
  visibility: hidden;
  transition:
    opacity 160ms ease-out,
    transform 160ms ease-out,
    visibility 0s 160ms;
}
@keyframes file-strip-arrow-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
}
@media (prefers-reduced-motion: reduce) {
  .file-strip-arrow,
  .file-strip-arrow:disabled {
    transition: none;
    animation: none;
  }
}
.file-strip-arrow:focus-visible {
  outline: 2px solid var(--ds-ink);
  outline-offset: 2px;
}
.file-recommendations {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
  gap: 20px;
  align-items: start;
}
.file-recommendation {
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--ds-hairline);
  border-radius: 18px;
  background: var(--ds-white);
}
.file-recommendation-header {
  margin-bottom: 20px;
}
.file-recommendation-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 24px;
  margin-bottom: 10px;
}
.file-recommendation-number {
  flex: none;
  margin-right: 4px;
  color: var(--ds-ink-2);

.file-dot::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px transparent;
  transition: box-shadow 120ms;
}
.file-swatch[aria-pressed=true]::after {
  box-shadow: 0 0 0 1.25px var(--ds-ink);
}
.file-swatch.is-out::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -2px;
  bottom: -2px;
  width: 1.5px;
  background: var(--ds-white);
  transform: translateX(-50%) rotate(45deg);
  box-shadow: 0 0 0 0.5px color-mix(in srgb,
 var(--ds-ink) 25%, transparent);
}
.file-swatch:focus-visible,
.file-dot:focus-visible {
  outline: none;
}
.file-swatch:focus-visible::after,
.file-dot:focus-visible::after {
  box-shadow: 0 0 0 2px var(--ds-ink);
}
.file-sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.file-size {
  height: 28px;
  min-width: 36px;
  padding: 0 10px;
  font-size: var(--file-small);
}
.file-size[aria-pressed=true] {
  background: var(--ds-ink);
  border-color: var(--ds-ink);
  color: var(--ds-page);
}
.file-stock {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--ds-ink-2);
  font-size: var(--file-small);
  line-height: 20px;
}
.file-stock::before {
  content: "";
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ds-ink-4);
}
.file-stock.is-in::before {
  background: var(--ds-teal);
}
.file-stock.is-low::before {
  background: var(--file-low-stock);
}
.file-stock.is-out {
  color: var(--ds-ink);
}
.file-stock.is-out::before {
  background: var(--ds-ink);
}
.file-price-was {
  margin-left: 6px;
  color: var(--ds-ink-3);
  font-weight: 350;
  text-decoration: line-through;
}
.file-dots {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  min-height: 20px;
}
.file-dot {
  width: 16px;
  height: 16px;
}
button.file-dot {
  cursor: pointer;
}
.file-dot.is-current::after {
  box-shadow: 0 0 0 1px var(--ds-ink);
}
.file-dots-more {
  margin-left: 2px;
  color: var(--ds-ink-3);
  font-size: var(--file-small);
  line-height: 20px;
}
.file-dots-label {
  min-width: 0;
  margin-left: 4px;
  overflow: hidden;
  color: var(--ds-ink-2);
  font-size: var(--file-small);
  line-height: 20px;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.file-product.is-tile > .file-dots,
.file-table.is-products thead .file-dots {
  margin-top: 8px;
}
.file-viewer {
  box-sizing: border-box;
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  flex-direction: column;
  overflow: hidden;
  background: transparent;
  color: var(--ds-white);
  font-family: var(--ds-font-text);
  font-size: var(--file-text);
  font-weight: 350;
  line-height: 24px;
  letter-spacing: -0.01em;
  touch-action: none;
  overscroll-behavior: contain;
}
.file-viewer[open] {
  display: flex;
}
.file-viewer:focus {
  outline: none;
}
.file-viewer::backdrop {
  background: color-mix(in srgb, var(--ds-ink) 80%, transparent);
  transition: background-color 200ms ease-out;
}
.file-viewer[data-zoomed]::backdrop {
  background: var(--ds-ink);
}
.file-viewer-bar,
.file-viewer-footer {
  transition: opacity 200ms ease-out;
}
.file-viewer[data-zoomed] :is(.file-viewer-bar, .file-viewer-footer) {
  opacity: 0;
  visibility: hidden;
  transition: opacity 200ms ease-out, visibility 0s 200ms;
}
.file-viewer-bar {
  display: flex;
  justify-content: flex-end;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 8px;
}
.file-viewer-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  overflow: hidden;
  touch-action: none;
}
.file-viewer-stage img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  border-radius: 12px;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  cursor: zoom-in;
  will-change: transform;
  animation: file-viewer-in 200ms ease-out;
}
.file-viewer[data-zoomed] .file-viewer-stage {
  overflow: visible;
}
.file-viewer[data-zoomed] .file-viewer-stage img {
  cursor: zoom-out;
}
@keyframes file-viewer-in {
  from {
    opacity: 0.35;
  }
}
.file-viewer-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: var(--file-text);
  line-height: 20px;
}
.file-viewer-steps {
  display: flex;
  align-items: center;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.file-viewer-title {
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: color-mix(in srgb, var(--ds-white) 72%, transparent);
}
.file-viewer-count {
  min-width: 64px;
  text-align: center;
}
.file-viewer .file-viewer-button {
  width: 32px;
  padding: 0;
  align-self: center;
  color: var(--ds-white);
}
@media (hover: hover) {
  .file-viewer .file-viewer-button:not(:disabled):hover {
    background: color-mix(in srgb, var(--ds-white) 12%, transparent);
  }
}
.file-viewer .file-viewer-button:disabled {
  border-color: transparent;
  background: transparent;
  color: color-mix(in srgb, var(--ds-white) 30%, transparent);
}
.file-viewer .file-viewer-button:focus-visible {
  outline: 2px solid var(--ds-white);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .file-viewer-stage img {
    animation: none;
  }
  .file-viewer::backdrop,
  .file-viewer-bar,
  .file-viewer-footer,
  .file-viewer[data-zoomed] :is(.file-viewer-bar, .file-viewer-footer) {
    transition: none;
  }
}
[data-quiet-focus]:focus {
  outline: none !important;
}
.file-image {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px 16px 16px;
  background: var(--ds-white);
  color: var(--ds-ink);
  border-radius: 24px;
  overflow: hidden;
  font-family: var(--ds-font-text);
  font-size: var(--file-text);
  font-weight: 350;
  line-height: 24px;
  letter-spacing: -0.01em;
}
.file-image[data-ratio=portrait] {
  width: 390px;
  height: 480px;
}
.file-image[data-ratio=square] {
  width: 390px;
  height: 390px;
}
.file-image[data-ratio=landscape] {
  width: 480px;
  height: 360px;
}
.file-image-body {
  display: flex;
  flex-direction: column;
  gap: 36px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.file-image-body > .file-card {
  padding: 0;
  max-width: none;
  background: transparent;
}
.file-image-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex: none;
  margin: 0 0 -2px;
  padding: 16px 0 4px;
  border-top: 1px solid var(--ds-hairline);
  color: var(--ds-ink-2);
}
.file-image-footer > span {
  color: var(--ds-ink-3);
}
.file-image-footer > span:empty {
  display: none;
}
.file-image-footer > span:empty + .file-wordmark {
  margin-left: auto;
}
.file-product-image-photo {
  position: relative;
  flex: 1;
  min-height: 0;
}
.file-product-image-photo img,
.file-product-image-photo .file-product-empty {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 20px;
  background: var(--ds-raised);
  aspect-ratio: auto;
}
.file-product-image-photo img {
  display: block;
}
.file-product-image-tag {
  position: absolute;
  top: 12px;
  left: 12px;
  box-sizing: border-box;
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: var(--ds-ink);
  color: var(--ds-white);
  font-size: 18px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.01em;
}
.file-product-image-tag.is-pick {
  background: var(--ds-ink);
}
.file-product-image-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: none;
}
.file-product-image .file-image-body {
  gap: 16px;
}
.file-product-image .file-image-footer {
  padding-top: 10px;
  font-size: var(--file-small);
  line-height: 18px;
}
.file-product-image .file-product-name {
  overflow-wrap: break-word;
}
.file-product-image-variant {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  margin-top: 6px;
}
.file-product-image-variant .file-dots {
  gap: 5px;
  padding: 1px 0 1px 4px;
}
.file-product-image-variant .file-dot {
  width: 14px;
  height: 14px;
}
.file-product-image-size {
  flex: none;
  margin-left: auto;
  color: var(--ds-ink-2);
  font-size: var(--file-small);
  line-height: 20px;
}
.file-image .file-card {
  font-size: var(--file-small);
  line-height: 20px;
}
.file-image .file-title {
  font-size: 24px;
}
.file-image .file-group-heading {
  font-size: 18px;
}
.file-image .file-intro,
.file-image .file-p,
.file-image .file-bullets,
.file-image .file-key {
  line-height: 20px;
}
@media (min-width: 768px) {
  .file-ground {
    padding: 36px;
  }
  .file-card {
    --file-pad-x: 36px;
    padding: 36px;
  }
  .file-card[data-width=phone] {
    --file-pad-x: 24px;
    padding: 24px 24px;
  }
  .file-title {
    font-size: 36px;
  }
  .file-intro,
  .file-closing,
  .file-p {
    max-width: 72ch;
  }
  .file-product-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .file-product-detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px 28px;
    align-items: start;
  }
  .file-product-modal {
    width: min(920px, calc(100% - 32px));
    height: auto;
    max-height: calc(100dvh - 32px);
    margin: auto;
    border-radius: 16px;
  }
  .file-product.is-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  .file-bleed {
    padding-inline: var(--file-pad-x) 0;
    scroll-padding-inline: var(--file-pad-x) 0;
  }
  .file-product-media .file-photos,
  .file-product-gallery .file-photos {
    margin-inline: 0;
    padding-inline: 0;
  }
  .file-product-media > .file-strip,
  .file-product-gallery > .file-strip {
    margin-inline: 0;
  }
  .file-product-detail .file-product-info {
    position: sticky;
    top: 56px;
  }
  .file-product-gallery .file-photos {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    height: auto;
    overflow: visible;
  }
  .file-product-gallery .file-photos:not(.is-single) {
    height: auto;
  }
  .file-product-gallery .file-photos img,
  .file-product-gallery .file-photos:not(.is-single) img {
    width: 100%;
    height: auto;
  }
  .file-product-media .file-photos {
    display: block;
    overflow: visible;
    height: auto;
  }
  .file-product-media .file-photos:not(.is-single) {
    height: auto;
  }
  .file-product-media .file-photos > .file-product-zoom:not(:first-child) {
    display: none;
  }
  .file-product-media .file-photos > .file-product-zoom,
  .file-product-gallery .file-photos > .file-product-zoom {
    width: 100%;
    height: auto;
  }
  .file-product-media .file-photos img {
    width: 100%;
    height: auto;
    max-height: calc(100cqw * 4 / 3);
    object-fit: cover;
  }
  .file-product-thumbs {
    display: flex;
  }
}
@media (max-width: 600px) {
  .file-card .file-button,
  .file-card .file-product-toggle {
    min-height: 44px;
  }
  .file-card .file-button[data-state] {
    --file-button-inset: 14px;
  }
  .file-card .file-button.is-pill {
    --file-button-icon-pad: 14px;
  }
  .file-viewer .file-viewer-button:not(.file-close) {
    width: 44px;
    height: 44px;
  }
  .file-close,
  .file-card .file-close {
    height: 32px;
    min-height: 32px;
  }
  .file-swatches {
    gap: 12px;
  }
  .file-size,
  .file-card .file-size {
    height: 32px;
    min-height: 32px;
    min-width: 38px;
  }
}
@media print {
  .file-ground {
    background: var(--ds-white);
    padding: 0;
  }
  .file-card,
  .file-ground .file-card {
    box-shadow: none;
    max-width: none;
    border-radius: 0;
  }
  .file-photos,
  .file-table-scroll {
    overflow: visible;
  }
  .file-strip-arrows {
    display: none;
  }
}
.file-figure[data-fit=contain] img {
  aspect-ratio: auto;
  object-fit: contain;
}
.file-data-table {
  min-width: 100%;
}
.file-data-table caption {
  text-align: start;
  color: var(--ds-ink-2);
  padding-bottom: 16px;
}
.file-data-table th,
.file-data-table td {
  min-width: 120px;
  max-width: 32ch;
  white-space: normal;
  overflow-wrap: anywhere;
}
.file-data-table [data-numeric] {
  text-align: end;
  font-variant-numeric: tabular-nums;
}
.file-data-table th button {
  background: none;
  border: 0;
  padding: 10px 0;
  color: inherit;
  font: inherit;
  text-align: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.file-compare {
  --file-compare-col: var(--file-product-col);
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: var(--file-compare-col);
  column-gap: 16px;
  margin-inline: calc(-1 * var(--file-pad-x));
  padding: 0 var(--file-pad-x);
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scroll-padding-left: var(--file-pad-x);
  scrollbar-width: none;
}
.file-compare::-webkit-scrollbar {
  display: none;
}
.file-compare:focus,
.file-compare-head:focus:not(:focus-visible) {
  outline: none;
}
.file-compare-column,
.file-compare-column > dl {
  display: grid;
  grid-row: 1 / -1;
  grid-template-rows: subgrid;
  min-width: 0;
  margin: 0;
}
.file-compare-column {
  scroll-snap-align: start;
}
.file-compare-column > dl {
  grid-row: 2 / -1;
}
.file-compare-head {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0 0 12px;
  border: 0;
  background: none;
  text-align: left;
  color: inherit;
  font: inherit;
}
button.file-compare-head {
  cursor: pointer;
}
.file-compare-photo {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  overflow: clip;
  background: var(--ds-raised);
}
.file-compare-photo > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.file-compare-photo-name {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  height: 100%;
  padding: 16px;
  text-align: center;
  overflow-wrap: anywhere;
  font-family: var(--ds-font-display);
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--ds-ink-2);
}
.file-compare-tags {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  align-items: flex-start;
}
.file-compare-tags > .file-badge {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-compare-column.is-selected .file-compare-photo {
  box-shadow: inset 0 0 0 2px var(--ds-ink);
}
.file-compare-tags .file-badge {
  gap: 4px;
}
.file-compare-open {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-top: -8px;
  color: var(--ds-ink);
  line-height: 20px;
}
.file-compare-head > strong {
  font-weight: 600;
  line-height: 20px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.file-compare-cell {
  padding: 8px 0;
  border-top: 1px solid var(--ds-hairline);
}
.file-compare-cell > dt {
  margin: 0;
}
.file-compare-cell > dd {
  margin: 0;
  display: flex;
  flex-direction: column;
  font-size: var(--file-text);
  line-height: 24px;
}
.file-compare-cell.is-best > dd {
  font-weight: 600;
}
.file-chart details {
  border-block: 1px solid var(--ds-hairline);
  padding: 12px 0;
}
.file-chart details > summary {
  cursor: pointer;
  min-height: 24px;
  padding: 10px 0;
  font-weight: 600;
}
.file-chart details > :not(summary) {
  margin-top: 12px;
}
@media print {
  .file-data-table {
    min-width: 0;
  }
  .file-data-table th,
  .file-data-table td {
    min-width: 0;
  }
}
.file-scaled-chart {
  max-width: 640px;
  width: 100%;
  box-sizing: border-box;
}
.file-signed-bars {
  display: grid;
  gap: 14px;
}
.file-signed-bars > div {
  display: grid;
  grid-template-columns: minmax(50px, 1fr) minmax(60px, 2fr) minmax(30px, auto);
  align-items: center;
  gap: 12px;
}
.file-signed-bars strong {
  text-align: end;
  font-weight: 600;
}
.file-bar-labels {
  display: flex;
  text-align: center;
}
.file-bar-labels > span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.file-chart-readout {
  margin: 0;
  min-height: 40px;
  color: var(--ds-ink-2);
}
.file-scaled-chart .file-chart-axis {
  white-space: normal;
}
.file-scaled-chart .file-chart-axis span:last-child {
  text-align: end;
}
.file-scaled-chart [tabindex]:focus {
  outline: none;
}
.file-scaled-chart [tabindex]:focus-visible circle:last-child {
  stroke-width: 3;
}
.file-image .file-chart details,
.file-image .file-chart-readout {
  display: none;
}

/* src/style.css */
html,
body,
#root {
  margin: 0;
  min-height: 100%;
  background: #061011;
}
* {
  box-sizing: border-box;
}
button,
a {
  font: inherit;
}
button {
  cursor: pointer;
}
.experience {
  height: 100svh;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #516b5b #061011;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  color: #e9eee7;
  background: #061011;
  position: relative;
}
.scroll-track {
  height: 900svh;
}
.viewport {
  position: sticky;
  top: 0;
  height: 100svh;
  min-height: 0;
  overflow: hidden;
  background: #061011;
}
.board-wrap,
.board,
.vignette {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.board {
  display: block;
}
.vignette {
  pointer-events: none;
  background:
    linear-gradient(
      90deg,
      rgba(3, 13, 13, .7) 0%,
      rgba(3, 13, 13, .38) 26%,
      transparent 62%),
    linear-gradient(
      0deg,
      rgba(3, 13, 13, .84),
      transparent 22%,
      transparent 80%,
      rgba(3, 13, 13, .35));
}
.topline,
.system-nav,
.readout,
.story,
.bottomline,
.detail {
  position: absolute;
  z-index: 5;
}
.topline {
  top: 24px;
  left: 34px;
  right: 34px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  border: 0;
  background: none;
  color: #bac8be;
  font: 10px/1.2 monospace;
