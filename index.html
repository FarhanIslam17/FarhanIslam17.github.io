/* Opening attention cue for the travel-mode switch (top right).
   Runs briefly when the page opens, then fades; removed on first use. */
@media (prefers-reduced-motion: no-preference) {
  @keyframes tm-attn-ring {
    0%   { box-shadow: 0 0 0 0 rgba(232,178,111,.55); }
    70%  { box-shadow: 0 0 0 12px rgba(232,178,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,178,111,0); }
  }
  @keyframes tm-attn-lift {

  }
}
.travel-mode.tm-attn {
  border-color: #c78e51;
  color: #f4d5ab;
  animation: tm-attn-ring 1.6s ease-out .8s 4, tm-attn-lift 1.6s ease-in-out .8s 4;
}

<script src="main.js?v=p09" defer></script><script>
(function(){
  var tries=0;
  var iv=setInterval(function(){
    var btn=document.querySelector('.travel-mode');
    if(btn||++tries>40){
      clearInterval(iv);
      if(!btn||btn.getAttribute('aria-pressed')==='true')return;
      btn.classList.add('tm-attn');
      var stop=function(){btn.classList.remove('tm-attn');};
      btn.addEventListener('click',stop,{once:true});
      setTimeout(stop,9000);
    }
  },250);
})();
